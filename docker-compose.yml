# DiscoveryHub local stack.
#
# One command, identical infrastructure for all five of us:
#
#   docker compose up -d
#   ./infra/smoke-test.sh
#   docker compose ps
#
# Credentials are development-only and deliberately in plain text. Nothing here should be
# reachable from anything but a laptop, and none of these values should survive into a deployment.
#
# Host ports
#   9092  Kafka              8090  Kafka UI
#   6379  Redis (P1)         9200  Elasticsearch (P3)
#   5433  Postgres (P2)      5434  Postgres (P4)      5435  Postgres (P5)
#   27017 MongoDB            9000  MinIO API          9001  MinIO console
#
# Application ports, as services arrive
#   8081 P1  8082 P2  8083 P3  8084 P4  8085 P5  4200 frontend

name: discoveryhub

services:

  # ---------------------------------------------------------------------- messaging
  kafka:
    image: apache/kafka:4.2.1
    container_name: discoveryhub-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Two listeners on purpose. A single listener advertising localhost:9092 works from the host
      # but breaks every container: the broker tells kafka-ui "reach me at localhost:9092" and
      # kafka-ui then dials its own container. INTERNAL is for containers, EXTERNAL for services
      # you run from your IDE. Application config uses localhost:9092.
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Off on purpose. A typo in a topic name should fail loudly, not silently create a topic
      # with one partition that nothing ever produces to.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  # Creates the six topics, then exits. Re-running is a no-op.
  kafka-init:
    image: apache/kafka:4.2.1
    container_name: discoveryhub-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./infra/kafka/create-topics.sh:/scripts/create-topics.sh:ro
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: discoveryhub-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: discoveryhub
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
      AUTH_TYPE: DISABLED
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------- P1 dedupe
  # P1's RedisDedupeStore fails open: if this is missing, ingestion still starts, health still
  # reports UP, and every duplicate passes through undetected. Idempotency (FR-1.6) depends on it.
  redis:
    image: redis:7.4.11
    container_name: discoveryhub-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ------------------------------------------------------- one datastore per service (NFR-1)
  # Separate instances, not separate schemas in one. There is no connection string that lets one
  # service read another's tables, so the isolation is enforced by infrastructure rather than by
  # everyone remembering.
  postgres-archive:
    image: postgres:17.11
    container_name: discoveryhub-postgres-archive
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: archive
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: archive
    volumes:
      - postgres-archive-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive -d archive"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-cases:
    image: postgres:17.11
    container_name: discoveryhub-postgres-cases
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: cases
      POSTGRES_USER: cases
      POSTGRES_PASSWORD: cases
    volumes:
      - postgres-cases-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cases -d cases"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-audit:
    image: postgres:17.11
    container_name: discoveryhub-postgres-audit
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: audit
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
    volumes:
      - postgres-audit-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Kept from the original compose. No service claims it yet — whoever adopts it owns it, and it
  # should belong to exactly one service like every other datastore here.
  mongodb:
    image: mongo:7
    container_name: discoveryhub-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------- P3 index
  # 9.4.x to match the Elasticsearch client Spring Boot 4.1.1 ships (9.4.5). The Java client
  # enforces a server version check, so an 8.x server refuses a 9.x client outright.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5
    container_name: discoveryhub-elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      cluster.name: discoveryhub
      # Capped so five people can run this alongside an IDE and a browser.
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # ----------------------------------------------------------- P2 and P5 object storage
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: discoveryhub-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: discoveryhub-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/create-buckets.sh"]
    volumes:
      - ./infra/minio/create-buckets.sh:/scripts/create-buckets.sh:ro
    restart: "no"

volumes:
  kafka-data:
  postgres-archive-data:
  postgres-cases-data:
  postgres-audit-data:
  mongo-data:
  elasticsearch-data:
  minio-data:
