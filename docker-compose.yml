# DiscoveryHub local stack.
#
# One command, identical infrastructure for all five of us:
#
#   docker compose up -d
#   ./infra/smoke-test.sh
#   docker compose ps
#
# Credentials are development-only and deliberately in plain text. Nothing here should be
# reachable from anything but a laptop, and none of these values should survive into a deployment.
#
# Host ports
#   9092  Kafka              8090  Kafka UI
#   6379  Redis (P1)         9200  Elasticsearch (P3)
#   5433  Postgres (P2)      5434  Postgres (P4)      5435  Postgres (P5)
#   27017 MongoDB            9000  MinIO API          9001  MinIO console
#
# Application ports, as services arrive
#   8081 P1  8082 P2  8083 P3  8084 P4  8085 P5  4200 frontend

name: discoveryhub

services:

  # ---------------------------------------------------------------------- messaging
  kafka:
    image: apache/kafka:4.2.1
    container_name: discoveryhub-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Two listeners on purpose. A single listener advertising localhost:9092 works from the host
      # but breaks every container: the broker tells kafka-ui "reach me at localhost:9092" and
      # kafka-ui then dials its own container. INTERNAL is for containers, EXTERNAL for services
      # you run from your IDE. Application config uses localhost:9092.
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Off on purpose. A typo in a topic name should fail loudly, not silently create a topic
      # with one partition that nothing ever produces to.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # 10 MiB, up from the 1,048,588 byte default, because messages carry their attachments as
      # base64 and base64 inflates by a third — the default rejects any attachment over ~750 KB,
      # which is an ordinary scanned invoice. The corpus never exposed this: its attachments are
      # 200 bytes to 3 KB.
      #
      # This is a ceiling, not a solution. Kafka is not a blob store, and every consumer now has
      # to be willing to fetch 10 MiB records. If real-world attachments start exceeding this,
      # move to a claim check — P1 writes bytes to MinIO and publishes only a reference — rather
      # than raising the number again.
      #
      # Four settings have to agree, and a missing one fails at a different layer each time:
      # broker (here), topic (create-topics.sh), producer max.request.size, consumer
      # max.partition.fetch.bytes.
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
      KAFKA_MAX_REQUEST_SIZE: 10485760
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  # Creates the six topics, then exits. Re-running is a no-op.
  kafka-init:
    image: apache/kafka:4.2.1
    container_name: discoveryhub-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./infra/kafka/create-topics.sh:/scripts/create-topics.sh:ro
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: discoveryhub-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: discoveryhub
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
      AUTH_TYPE: DISABLED
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------- P1 dedupe
  # P1's RedisDedupeStore fails open: if this is missing, ingestion still starts, health still
  # reports UP, and every duplicate passes through undetected. Idempotency (FR-1.6) depends on it.
  redis:
    image: redis:7.4.11
    container_name: discoveryhub-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ------------------------------------------------------- one datastore per service (NFR-1)
  # Separate instances, not separate schemas in one. There is no connection string that lets one
  # service read another's tables, so the isolation is enforced by infrastructure rather than by
  # everyone remembering.
  postgres-archive:
    image: postgres:17.11
    container_name: discoveryhub-postgres-archive
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: archive
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: archive
    volumes:
      - postgres-archive-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive -d archive"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-cases:
    image: postgres:17.11
    container_name: discoveryhub-postgres-cases
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: cases
      POSTGRES_USER: cases
      POSTGRES_PASSWORD: cases
    volumes:
      - postgres-cases-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cases -d cases"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-audit:
    image: postgres:17.11
    container_name: discoveryhub-postgres-audit
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: audit
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
    volumes:
      - postgres-audit-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # P4 Legal Hold owns its own datastore (NFR-1: one datastore, one owner). Separate instance, not
  # a schema in the cases database — no connection string lets the hold-service read the
  # case-service's tables or vice versa.
  postgres-holds:
    image: postgres:17.11
    container_name: discoveryhub-postgres-holds
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: holds
      POSTGRES_USER: holds
      POSTGRES_PASSWORD: holds
    volumes:
      - postgres-holds-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holds -d holds"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Kept from the original compose. No service claims it yet — whoever adopts it owns it, and it
  # should belong to exactly one service like every other datastore here.
  mongodb:
    image: mongo:7
    container_name: discoveryhub-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------- P3 index
  # 9.4.x to match the Elasticsearch client Spring Boot 4.1.1 ships (9.4.5). The Java client
  # enforces a server version check, so an 8.x server refuses a 9.x client outright.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5
    container_name: discoveryhub-elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      cluster.name: discoveryhub
      # Capped so five people can run this alongside an IDE and a browser.
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # ----------------------------------------------------------- P2 and P5 object storage
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: discoveryhub-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: discoveryhub-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/create-buckets.sh"]
    volumes:
      - ./infra/minio/create-buckets.sh:/scripts/create-buckets.sh:ro
    restart: "no"

  # ------------------------------------------------------------------ application
  # Behind a profile on purpose. Day to day you want the datastores in Docker and the services in
  # your IDE, where you can debug them and a change costs a restart rather than an image rebuild:
  #
  #   docker compose up -d                      infrastructure only
  #
  # For a demo, a clean-machine check, or anyone who just wants it running:
  #
  #   docker compose --profile app up -d --build     everything
  #
  # Both use the same compose file, so there is no second definition to drift.
  ingestion-service:
    profiles: ["app"]
    build:
      # Root context: the module depends on contracts/ and inherits the parent POM, neither of
      # which is visible from the service directory.
      context: .
      dockerfile: services/ingestion-service/Dockerfile
    container_name: discoveryhub-ingestion
    ports:
      - "8081:8081"
    environment:
      # Service names, not localhost — inside the network localhost is the container itself.
      KAFKA_BOOTSTRAP: kafka:19092
      REDIS_HOST: redis
      SERVER_PORT: 8081
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  storage-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/storage-service/Dockerfile
    container_name: discoveryhub-storage
    ports:
      - "8082:8082"
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      DB_URL: jdbc:postgresql://postgres-archive:5432/archive
      SERVER_PORT: 8082
      # The hold-service owns /holds/check; inside the Docker network it is reachable by service
      # name. The storage-service's disposition job calls this before deleting anything.
      HOLDS_BASE_URL: http://hold-service:8086
    depends_on:
      kafka:
        condition: service_healthy
      postgres-archive:
        condition: service_healthy
    restart: unless-stopped

  # P4 Case Management — case lifecycle, custodians, evidence. Owner: Teresa.
  case-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/case-service/Dockerfile
    container_name: discoveryhub-case
    ports:
      - "8084:8084"
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      DB_URL: jdbc:postgresql://postgres-cases:5432/cases
      SERVER_PORT: 8084
    depends_on:
      kafka:
        condition: service_healthy
      postgres-cases:
        condition: service_healthy
    restart: unless-stopped

  # P4 Legal Hold — holds, scope resolution, hold check, release. Owner: Teresa.
  # Separate deployable from the case-service: case and hold are two bounded contexts with their
  # own datastores, communicating via cases.events (close → release) and the synchronous
  # /holds/check endpoint (the disposition guard P2 calls before deleting).
  hold-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/hold-service/Dockerfile
    container_name: discoveryhub-hold
    ports:
      - "8086:8086"
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      DB_URL: jdbc:postgresql://postgres-holds:5432/holds
      SERVER_PORT: 8086
      CASES_BASE_URL: http://case-service:8084
      ARCHIVE_BASE_URL: http://storage-service:8082
    depends_on:
      kafka:
        condition: service_healthy
      postgres-holds:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka-data:
  postgres-archive-data:
  postgres-cases-data:
  postgres-audit-data:
  postgres-holds-data:
  mongo-data:
  elasticsearch-data:
  minio-data:
