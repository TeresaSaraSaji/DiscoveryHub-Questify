# Nginx site config for the Angular app. Replaces the image's default.conf.
#
# Two jobs: serve the built bundle, and hand every unknown path to index.html so the Angular
# router can resolve it (`/cases`, `/export-audit`, and a browser refresh on either).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The bundle is already minified; this is for the HTML and the JSON-ish bits.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Runtime service URLs, read before the app boots. Deliberately never cached: the whole point
    # of keeping it out of the bundle is that a built image can be repointed at another host by
    # editing this one file, and a cached copy would mean the edit appears to do nothing.
    #
    # An exact-match location outranks the regex block below, so this wins for /api-config.js even
    # though that also ends in .js.
    location = /api-config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Never cache the entry point. It names the hashed chunks, so a cached index.html pins the
    # browser to a previous deploy's filenames and the app breaks on the next release.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Everything else the build emits carries a content hash in its filename, so it can be cached
    # indefinitely — a changed file is a different URL.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback. Without this, a refresh on /cases asks Nginx for a file called "cases", gets a
    # 404, and the router never runs — the classic single-page-app deployment bug.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # For the compose healthcheck. Answered by Nginx itself, so it reports that the server is
    # serving rather than that the container process exists.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }
}
