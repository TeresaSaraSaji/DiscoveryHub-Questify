# DiscoveryHub local stack.
#
# Every datastore here has exactly one owning service (NFR-1). The three PostgreSQL instances are
# genuinely separate containers rather than three databases in one, so there is no configuration
# in which P4 can read P2's tables even by accident.
#
# Credentials are development-only and deliberately in plain text. Nothing in this file should be
# reachable from anything but a laptop.
#
#   docker compose -f infra/docker-compose.yml up -d
#   docker compose -f infra/docker-compose.yml ps
#   docker compose -f infra/docker-compose.yml down -v     # -v wipes the data
#
# Host ports
#   9092  Kafka            8090  Kafka UI
#   6379  Redis (P1)       9200  Elasticsearch (P3)
#   5433  Postgres (P2)    5434  Postgres (P4)    5435  Postgres (P5)
#   9000  MinIO API        9001  MinIO console (minioadmin / minioadmin)
#
# Application ports, for when the services exist
#   8081 P1  8082 P2  8083 P3  8084 P4  8085 P5  4200 frontend

name: discoveryhub

services:

  # ---------------------------------------------------------------- messaging
  kafka:
    image: apache/kafka:4.2.1
    container_name: dh-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # INTERNAL is for containers on this network, EXTERNAL for services running on the host
      # from your IDE. Application config should use localhost:9092.
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Off on purpose. A typo in a topic name should fail loudly, not silently create a topic
      # that nothing ever produces to.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # Creates the six topics from architecture.md, then exits. Re-running is harmless.
  kafka-init:
    image: apache/kafka:4.2.1
    container_name: dh-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./kafka/create-topics.sh:/scripts/create-topics.sh:ro
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: dh-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: discoveryhub
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
      AUTH_TYPE: DISABLED

  # ------------------------------------------------------------------ P1 store
  redis:
    image: redis:7.4.11
    container_name: dh-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------ P2 store
  postgres-archive:
    image: postgres:17.11
    container_name: dh-pg-archive
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: archive
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: archive
    volumes:
      - pg-archive-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive -d archive"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------ P4 store
  postgres-cases:
    image: postgres:17.11
    container_name: dh-pg-cases
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: cases
      POSTGRES_USER: cases
      POSTGRES_PASSWORD: cases
    volumes:
      - pg-cases-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cases -d cases"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------ P5 store
  postgres-audit:
    image: postgres:17.11
    container_name: dh-pg-audit
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: audit
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
    volumes:
      - pg-audit-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------ P3 store
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
    container_name: dh-elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      # Capped so five people can run this alongside an IDE and a browser.
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      cluster.name: discoveryhub
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # -------------------------------------------------------- P2 and P5 blob store
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: dh-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 15

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: dh-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/create-buckets.sh"]
    volumes:
      - ./minio/create-buckets.sh:/scripts/create-buckets.sh:ro
    restart: "no"

volumes:
  kafka-data:
  pg-archive-data:
  pg-cases-data:
  pg-audit-data:
  es-data:
  minio-data:
