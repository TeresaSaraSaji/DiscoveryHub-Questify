spring:
  application:
    name: case-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/cases}
    username: cases
    password: cases

  jpa:
    # Schema comes from Flyway, never from Hibernate. validate fails loudly on drift.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: p4-case
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # String serdes + manual JSON via the Jackson 3 ObjectMapper Boot auto-configures. See the
      # storage-service application.yml for why we do not use Spring Kafka's JsonDeserializer here.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

discoveryhub:
  cases:
    # Default page size for case and evidence listings. Capped by the controller so a caller
    # cannot request thousands of rows in one shot.
    default-page-size: 50
    max-page-size: 200

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      # Actuator endpoints (/actuator/health, the frontend's liveness probe) sit behind their own
      # handler mapping, separate from @RestController — CorsConfig's WebMvcConfigurer registers
      # CORS on the latter only, so without this, every regular API call works from the browser
      # and every actuator call is silently blocked, which looks like the service being down when
      # it is actually up. Confirmed: an OPTIONS preflight to /actuator/health returned 200 with
      # no Access-Control-* headers at all before this was added.
      cors:
        allowed-origins: ${discoveryhub.cors.allowed-origins:http://localhost:4200}
        allowed-methods: GET,OPTIONS
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.discoveryhub: DEBUG
