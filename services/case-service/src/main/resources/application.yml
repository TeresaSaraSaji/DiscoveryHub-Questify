spring:
  application:
    name: case-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/cases}
    username: cases
    password: cases

  jpa:
    # Schema comes from Flyway, never from Hibernate. validate fails loudly on drift.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: p4-case
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # String serdes + manual JSON via the Jackson 3 ObjectMapper Boot auto-configures. See the
      # storage-service application.yml for why we do not use Spring Kafka's JsonDeserializer here.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

discoveryhub:
  cases:
    # Default page size for case and evidence listings. Capped by the controller so a caller
    # cannot request thousands of rows in one shot.
    default-page-size: 50
    max-page-size: 200
    archive:
      # P2, asked whether a message exists before it is accepted as evidence. Evidence is filed
      # from search results and the index is eventually consistent with the archive, so without
      # this a message disposition destroyed can still be filed onto a case — an evidence row
      # pointing at nothing, which surfaces later as an item an export cannot package.
      base-url: ${ARCHIVE_BASE_URL:http://localhost:8082}
      timeout: 5s

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      # Actuator has its own CORS and does not inherit config/CorsConfig: these endpoints are
      # served by a separate handler mapping that ignores addCorsMappings. Without this the
      # frontend's status strip reports this service DOWN while it answers every other request.
      cors:
        allowed-origin-patterns: ${discoveryhub.web.cors.allowed-origins:http://localhost:[*],http://127.0.0.1:[*]}
        allowed-methods: GET
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.discoveryhub: DEBUG
