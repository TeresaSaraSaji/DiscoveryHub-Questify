spring:
  application:
    name: evidence

  datasource:
    url: jdbc:postgresql://localhost:5435/audit
    username: audit
    password: audit

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: p5-evidence
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.discoveryhub.contracts
      max-poll-records: 200
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all

discoveryhub:
  s3:
    endpoint: http://localhost:9000
    region: us-east-1
    access-key: minioadmin
    secret-key: minioadmin
    path-style-access: true
    # Packages are assembled under staging and moved to packages on completion, so a failed job
    # never leaves a partial download available (decision 6 in architecture.md).
    staging-bucket: export-staging
    package-bucket: export-packages
  archive:
    # Exports fetch message bodies and attachments from P2 rather than keeping a second copy.
    base-url: http://localhost:8082
  cases:
    base-url: http://localhost:8084

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.discoveryhub: DEBUG
