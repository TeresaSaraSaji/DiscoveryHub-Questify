spring:
  application:
    name: export

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/audit}
    username: audit
    password: audit

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: p5-export
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # See storage-service/application.yml: Spring Kafka's JsonDeserializer is Jackson 2 based,
      # Boot 4.1 ships Jackson 3, so we use plain String serdes and do the JSON ourselves.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

discoveryhub:
  export:
    archive:
      # P2 Archive base URL. Export packages are built entirely from what P2 hands back — P5
      # stores nothing of its own until a package is finished.
      base-url: ${ARCHIVE_BASE_URL:http://localhost:8082}
      timeout: 10s
    storage:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      staging-bucket: export-staging
      packages-bucket: export-packages
      # How long a download link is valid for once issued (FR-6.4: expiring link).
      download-link-ttl: 15m

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      # Actuator endpoints (/actuator/health, the frontend's liveness probe) sit behind their own
      # handler mapping, separate from @RestController — CorsConfig's WebMvcConfigurer registers
      # CORS on the latter only, so without this, every regular API call works from the browser
      # and every actuator call is silently blocked, which looks like the service being down when
      # it is actually up. Confirmed: an OPTIONS preflight to /actuator/health returned 200 with
      # no Access-Control-* headers at all before this was added.
      cors:
        allowed-origins: ${discoveryhub.cors.allowed-origins:http://localhost:4200}
        allowed-methods: GET,OPTIONS
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.discoveryhub: INFO
