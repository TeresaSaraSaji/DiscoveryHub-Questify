spring:
  application:
    name: export

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/audit}
    username: audit
    password: audit

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: p5-export
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # See storage-service/application.yml: Spring Kafka's JsonDeserializer is Jackson 2 based,
      # Boot 4.1 ships Jackson 3, so we use plain String serdes and do the JSON ourselves.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

discoveryhub:
  export:
    archive:
      # P2 Archive base URL. Export packages are built entirely from what P2 hands back — P5
      # stores nothing of its own until a package is finished.
      base-url: ${ARCHIVE_BASE_URL:http://localhost:8082}
      timeout: 10s
    cases:
      # P4 case-service, asked for a case's evidence items when an export is scoped by case
      # (FR-6.1). Read at the moment the job runs, not when it was requested, so an export
      # reflects the case as it stands when the package is built.
      base-url: ${CASES_BASE_URL:http://localhost:8084}
      timeout: 10s
    storage:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      staging-bucket: export-staging
      packages-bucket: export-packages
      # How long a download link is valid for once issued (FR-6.4: expiring link).
      download-link-ttl: 15m

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      # Actuator has its own CORS and does not inherit config/CorsConfig: these endpoints are
      # served by a separate handler mapping that ignores addCorsMappings. Without this the
      # frontend's status strip reports this service DOWN while it answers every other request.
      cors:
        allowed-origin-patterns: ${discoveryhub.web.cors.allowed-origins:http://localhost:[*],http://127.0.0.1:[*]}
        allowed-methods: GET
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.discoveryhub: INFO
