spring:
  application:
    name: ingestion
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Boot 4 ships Jackson 3 (tools.jackson). The older JsonSerializer is Jackson 2 based and
      # fails at first send with NoClassDefFoundError on com.fasterxml.jackson.databind.JavaType.
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
        # Must match max.message.bytes on the broker and on the topic. Attachments travel as
        # base64, which inflates by a third, so the 1 MiB default rejects any attachment over
        # roughly 750 KB. Configure one layer and not the others and the send still fails, just
        # further away from the setting you changed.
        max.request.size: 10485760
        # Has to be at least max.request.size or the producer cannot buffer a single large record.
        buffer.memory: 67108864
    properties:
      spring.json.add.type.headers: false

  servlet:
    multipart:
      # Upload limits, separate from the JSON body cap below. 64 MiB accommodates the 10.7 MB
      # corpus fixture with room to spare; Spring's defaults are 1 MB per file and 10 MB per
      # request, which reject it outright.
      max-file-size: 64MB
      max-request-size: 64MB
      file-size-threshold: 1MB

server:
  port: ${SERVER_PORT:8081}

discoveryhub:
  ingestion:
    dedupe-ttl: P7D
    max-batch-size: 1000
    max-request-bytes: 16777216
    upload:
      # Uploads are chunked through the same ingest path rather than held whole in memory, so a
      # file may carry far more messages than a single API batch is allowed to.
      chunk-size: 200
      max-messages: 50000
      # A 12,000-message file would otherwise return a 12,000-entry result array. Counts are
      # always exact; only the per-item detail is capped.
      max-reported-problems: 50
      # Concurrent async uploads. Each holds a chunk in memory, so this is small on purpose and
      # excess requests are refused rather than queued into an out-of-memory error.
      workers: 2
      max-tracked-jobs: 200
      job-retention: PT2H

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      group:
        # What a load balancer should ask about: can this instance accept a message right now?
        # Kafka can stop that, Redis cannot -- see DedupeStoreHealthIndicator.
        readiness:
          include: readinessState,kafka
        # Liveness must not depend on anything remote, or a broker blip restarts every pod.
        liveness:
          include: livenessState
  health:
    # Replaced by DedupeStoreHealthIndicator. The stock contributor reports DOWN when Redis is
    # unreachable, which contradicts RedisDedupeStore failing open and would have a probe evict an
    # instance that is deliberately still serving.
    redis:
      enabled: false
    # P1 owns no database and reads nothing from MongoDB. The starter is on the classpath, and its
    # health contributor would otherwise take this service DOWN whenever an unrelated datastore is
    # unreachable. A service should only report unhealthy for something it actually needs.
    #
    # The key is "mongodb" even though the component shows up in /actuator/health as "mongo" —
    # ConditionalOnEnabledHealthIndicator("mongodb") in MongoHealthContributorAutoConfiguration.
    # Guessing "mongo" here silently does nothing at all.
    mongodb:
      enabled: false

logging:
  level:
    com.discoveryhub: INFO
