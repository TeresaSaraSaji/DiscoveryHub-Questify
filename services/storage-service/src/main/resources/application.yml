spring:
  application:
    name: archive

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/archive}
    username: archive
    password: archive

  jpa:
    # Schema comes from Flyway, never from Hibernate. validate fails loudly on drift instead of
    # quietly altering the system of record.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: p2-archive
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Spring Kafka's JsonDeserializer/JsonSerializer are built against Jackson 2, but Boot 4.1
      # ships Jackson 3 on the classpath. Rather than carry two Jackson majors just for Kafka
      # serdes, we use plain String serdes and parse/serialise JSON in the listeners and publisher
      # with the Jackson 3 ObjectMapper that Boot auto-configures. Malformed records are caught in
      # the listener and logged, so one bad message cannot wedge the consumer.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    listener:
      # Per-record ack mode: an exception on one record does not roll back the whole batch, and
      # the offset for a record is only committed after its listener returns normally.
      ack-mode: record
      # The CommonErrorHandler bean (config/KafkaConsumerConfig) retries transient failures with an
      # unbounded fixed backoff, so a Storage/DB/S3 outage parks the consumer on the failing record
      # instead of skipping it. The offset is not committed until processing succeeds, so Kafka
      # redelivers pending records in order once Storage recovers — no messages lost.

discoveryhub:
  archive:
    # P4 Hold-service base URL, for the synchronous disposition guard (architecture decision 4).
    # The hold-service owns GET /holds/check; the case-service is a separate deployable on 8084.
    #
    # This is the guard applied to every delete command arriving on disposition.commands, and it
    # fails closed: unreachable counts as held, so an absent hold-service makes P2 refuse deletions
    # rather than perform unverified ones.
    hold-check-base-url: ${HOLDS_BASE_URL:http://localhost:8086}
    hold-check-timeout: 5s
    # Attachment bytes live on local disk (the primary copy the read API serves), with an optional
    # S3 offload copy for durable "after use" retrieval. Message metadata stays in PostgreSQL. See
    # V4__attachment_storage.sql and the com.discoveryhub.archive.storage package.
    storage:
      local:
        base-dir: ${ATTACHMENT_DIR:./data/attachments}
      s3:
        # Off by default. Flip to true to also write every attachment to S3 (real S3 or MinIO).
        enabled: ${S3_ENABLED:false}
        # Leave empty to use real AWS S3; set it for MinIO / a local S3-compatible server.
        endpoint: ${S3_ENDPOINT:http://localhost:9000}
        region: ${S3_REGION:us-east-1}
        # infra/minio/create-buckets.sh provisions this one; a different name here silently means
        # every offload fails with NoSuchBucket and s3_key stays null on every row.
        bucket: ${S3_BUCKET:archive-attachments}
        # Leave empty to fall back to the default AWS credentials provider chain.
        access-key: ${S3_ACCESS_KEY:minioadmin}
        secret-key: ${S3_SECRET_KEY:minioadmin}
        # Required for MinIO; harmless for AWS S3.
        path-style-access: ${S3_PATH_STYLE:true}
        key-prefix: attachments/

# No retention policy here, and no scheduler. P2.2 owns the policy (retention_policies,
# configurable at runtime) and P2 applies its decisions through DispositionCommandListener. One
# policy, one owner: two services each holding their own copy of "email lives seven years" is how
# the two quietly diverge and a corpus gets swept twice on two different cutoffs.

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      # Actuator has its own CORS, and config/CorsConfig does not reach it: these endpoints are
      # served by a separate handler mapping that ignores addCorsMappings. Without this the
      # frontend's status strip reports this service DOWN while it answers every other request.
      cors:
        allowed-origin-patterns: ${discoveryhub.web.cors.allowed-origins:http://localhost:[*],http://127.0.0.1:[*]}
        allowed-methods: GET
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.discoveryhub: DEBUG
