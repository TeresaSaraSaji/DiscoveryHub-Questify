spring:
  application:
    name: archive

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/archive}
    username: archive
    password: archive

  jpa:
    # Schema comes from Flyway, never from Hibernate. validate fails loudly on drift instead of
    # quietly altering the system of record.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: p2-archive
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Spring Kafka's JsonDeserializer/JsonSerializer are built against Jackson 2, but Boot 4.1
      # ships Jackson 3 on the classpath. Rather than carry two Jackson majors just for Kafka
      # serdes, we use plain String serdes and parse/serialise JSON in the listeners and publisher
      # with the Jackson 3 ObjectMapper that Boot auto-configures. Malformed records are caught in
      # the listener and logged, so one bad message cannot wedge the consumer.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

discoveryhub:
  archive:
    # P4 Case & Hold base URL. The hold guard this service applies to every delete command it
    # receives on disposition.commands — unreachable counts as held, so an absent P4 makes P2
    # refuse deletions rather than perform unverified ones (architecture decision 4).
    hold-check-base-url: ${CASES_BASE_URL:http://localhost:8084}
    hold-check-timeout: 5s

# No retention policy here. P2.2 owns it (retention_policies, configurable at runtime) and P2
# applies its decisions through DispositionCommandListener. One policy, one owner: two services
# each holding their own copy of "email lives seven years" is how the two quietly diverge and a
# corpus gets swept twice on two different cutoffs.

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.discoveryhub: DEBUG
