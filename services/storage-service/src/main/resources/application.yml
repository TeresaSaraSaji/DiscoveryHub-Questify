spring:
  application:
    name: archive

  # Slim Postgres: legal-hold state and retention/disposition bookkeeping only. Message content
  # (including attachment bytes) lives in MongoDB — see spring.mongodb below and
  # domain/ArchivedMessageDocument.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/archive}
    username: archive
    password: archive

  # NOT spring.data.mongodb — Boot 4.1 moved MongoProperties into its own autoconfigure module
  # (spring-boot-mongodb, same split as Kafka/Flyway elsewhere in this file) and renamed the
  # prefix to spring.mongodb in the move. spring.data.mongodb.* still parses as valid YAML and
  # shows up in /actuator/env, which is what makes this trap dangerous: nothing fails, nothing
  # warns, the app starts clean and connects — every write just silently lands in the driver's
  # own fallback database ("test") instead of the one configured. Confirmed against a real Mongo
  # container, not a hypothetical.
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017/archive}
    database: ${MONGO_DATABASE:archive}

  jpa:
    # Schema comes from Flyway, never from Hibernate. validate fails loudly on drift instead of
    # quietly altering the system of record.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: p2-archive
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Spring Kafka's JsonDeserializer/JsonSerializer are built against Jackson 2, but Boot 4.1
      # ships Jackson 3 on the classpath. Rather than carry two Jackson majors just for Kafka
      # serdes, we use plain String serdes and parse/serialise JSON in the listeners and publisher
      # with the Jackson 3 ObjectMapper that Boot auto-configures. Malformed records are caught in
      # the listener and logged, so one bad message cannot wedge the consumer.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    listener:
      # Per-record ack mode: an exception on one record does not roll back the whole batch, and
      # the offset for a record is only committed after its listener returns normally.
      ack-mode: record
      # The CommonErrorHandler bean (config/KafkaConsumerConfig) retries transient failures with an
      # unbounded fixed backoff, so a Storage/DB/S3 outage parks the consumer on the failing record
      # instead of skipping it. The offset is not committed until processing succeeds, so Kafka
      # redelivers pending records in order once Storage recovers — no messages lost.

discoveryhub:
  archive:
    # P4 Hold-service base URL, for the synchronous disposition guard (architecture decision 4).
    # The hold-service owns GET /holds/check; the case-service is a separate deployable on 8084.
    #
    # This is the guard applied to every delete command arriving on disposition.commands, and it
    # fails closed: unreachable counts as held, so an absent hold-service makes P2 refuse deletions
    # rather than perform unverified ones.
    hold-check-base-url: ${HOLDS_BASE_URL:http://localhost:8086}
    hold-check-timeout: 5s
  retention:
    # Unused by P2 itself — P2.2 owns the retention policy and the sweep (retention_policies,
    # configurable at runtime there). default-period/per-type survive here only as the fallback
    # RetentionProperties needs to construct; demo-period below is the one still live.
    default-period: P2555D
    per-type:
      EMAIL: P2555D
      CHAT: P1095D
    # How long a message P1 tagged with RetentionLabels.DEMO_RETENTION (the "DEMO" option on
    # POST /messages/upload) stays before {@code retentionOverrideAt} makes it eligible — stamped
    # by MessageMapper at upload time. P2.2's own eligibility query does not read this column yet,
    # so the override currently only documents intent rather than shortening a real sweep; kept
    # here so that gap is visible rather than silently dropped.
    demo-period: ${RETENTION_DEMO_PERIOD:PT2M}

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      # Actuator has its own CORS, and config/CorsConfig does not reach it: these endpoints are
      # served by a separate handler mapping that ignores addCorsMappings. Without this the
      # frontend's status strip reports this service DOWN while it answers every other request.
      cors:
        allowed-origin-patterns: ${discoveryhub.web.cors.allowed-origins:http://localhost:[*],http://127.0.0.1:[*]}
        allowed-methods: GET
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.discoveryhub: DEBUG
